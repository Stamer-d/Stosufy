name: iOS
permissions:
  contents: write
on:
  workflow_dispatch:
  # After each release (release.yml), its IPA
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Test builds of the work branch
  push:
    branches: ['claude/inspiring-lamport-g69unm']

# Builds the iPhone app as an unsigned IPA and attaches it to the release of the same version
# (or keeps it as a build artifact). Without a paid Apple developer account it can't be
# signed here: it's installed with AltStore or Sideloadly, which sign it with your Apple ID.
jobs:
  ios:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-ios

      - name: Install the tools
        run: |
          brew install xcodegen || true
          npm ci

      - name: Create .env file
        run: echo "VITE_CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> .env

      - name: Create the Xcode project
        run: |
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/icon.png
          ls src-tauri/gen/apple

      # The Rust part, built here: Xcode's own step for it needs a running `tauri ios build`,
      # which can't run without signing
      - name: Build the Rust library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '14.0'
        run: |
          npm run build
          cd src-tauri
          cargo build --release --target aarch64-apple-ios --lib --features tauri/custom-protocol
          LIB=target/aarch64-apple-ios/release/libstosufy_tauri_lib.a
          ls -la $LIB
          for dir in gen/apple/Externals/arm64/release gen/apple/Externals/arm64/Release; do
            mkdir -p $dir
            cp $LIB $dir/libapp.a
          done
          cd gen/apple
          perl -0pi -e 's/shellScript = "[^\n]*xcode-script[^\n]*";/shellScript = "true";/' *.xcodeproj/project.pbxproj
          grep -c xcode-script *.xcodeproj/project.pbxproj || echo "Xcode's Rust step replaced"
          grep -rn "libapp\|Externals" *.xcodeproj/project.pbxproj | head -20

      - name: Build the app (unsigned)
        run: |
          cd src-tauri/gen/apple
          PROJECT=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)_iOS
          echo "Project $PROJECT, scheme $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=$(find src-tauri/gen/apple/build/Build/Products -name '*.app' -type d | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "Stosufy-$VERSION.ipa" Payload
          echo "IPA=Stosufy-$VERSION.ipa" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # An AltStore source: added once in AltStore, it shows new versions to update to
      - name: Make the AltStore source
        run: |
          SIZE=$(stat -f%z "$IPA")
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > altstore-source.json <<JSON
          {
            "name": "Stosufy",
            "identifier": "de.stamer.stosufy.source",
            "website": "https://github.com/Stamer-d/Stosufy",
            "apps": [
              {
                "name": "Stosufy",
                "bundleIdentifier": "com.Stosufy.app",
                "developerName": "Stamer",
                "subtitle": "The music player for osu! players",
                "localizedDescription": "Every song from osu!'s beatmaps, with playlists, lyrics and the gameplay.",
                "iconURL": "https://raw.githubusercontent.com/Stamer-d/Stosufy/main/src-tauri/icons/icon.png",
                "tintColor": "8b5cf6",
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "downloadURL": "https://github.com/Stamer-d/Stosufy/releases/download/Stosufy-v$VERSION/$IPA",
                    "size": $SIZE,
                    "minOSVersion": "14.0"
                  }
                ]
              }
            ],
            "news": []
          }
          JSON
          python3 -m json.tool altstore-source.json > /dev/null

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}

      - name: Attach it to the release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "Stosufy-v$VERSION" > /dev/null 2>&1; then
            gh release upload "Stosufy-v$VERSION" "$IPA" altstore-source.json --clobber
          else
            echo "::notice::No release Stosufy-v$VERSION yet: the IPA is in the build artifacts"
          fi
