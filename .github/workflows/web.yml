# The web app (src/web) on GitHub Pages: https://stamer-d.github.io/Stosufy/
# (Settings → Pages → Source: GitHub Actions)
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          WEB_BASE: /Stosufy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-web
      - id: deployment
        uses: actions/deploy-pages@v4
