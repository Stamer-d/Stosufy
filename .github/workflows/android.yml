name: Android
permissions:
  contents: write
on:
  workflow_dispatch:
  # After each release (release.yml), its APK
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Test builds of the work branch
  push:
    branches: ['claude/inspiring-lamport-g69unm']

# Builds the Android app (an APK for phones with 64-bit and 32-bit ARM) and attaches it to
# the release of the same version (made by release.yml), or keeps it as a build artifact.
#
# Signing: with the secrets ANDROID_KEYSTORE (the keystore, base64), ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_ALIAS the APK is signed with that key, so new versions install over old
# ones. Without them a key is made for this build only (installing a new version then needs
# the old one removed first).
jobs:
  android:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner has the Android SDK and NDK already
      - name: Find the Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)" >> $GITHUB_ENV
          ls $ANDROID_HOME/build-tools $ANDROID_HOME/ndk

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Create .env file
        run: echo "VITE_CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> .env

      - name: Create the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          echo "Unsigned APK: $UNSIGNED"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a key made for this build only"
            KEYSTORE_PASSWORD=stosufy-temporary
            KEY_ALIAS=stosufy
            keytool -genkeypair -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Stosufy"
          fi
          $BUILD_TOOLS/zipalign -f 4 "$UNSIGNED" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out "Stosufy-$VERSION.apk" aligned.apk
          $BUILD_TOOLS/apksigner verify "Stosufy-$VERSION.apk"
          rm -f release.keystore
          echo "APK=Stosufy-$VERSION.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "Stosufy-v$VERSION" > /dev/null 2>&1; then
            gh release upload "Stosufy-v$VERSION" "$APK" --clobber
          else
            echo "::notice::No release Stosufy-v$VERSION yet: the APK is in the build artifacts"
          fi
